version: '3.8'

services:
  windirstat-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windirstat-mcp-server
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - C:/:/host-c:ro
    # Auto-remove container when stopped
    # But we want to reuse, so we manage lifecycle externally
    restart: "no"
    # Health check to detect idle
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: windirstat-mcp-net
