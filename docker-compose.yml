services:
  windirstat-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windirstat-mcp-server
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - C:/:/host-c:ro
    # Reuse container lifecycle is managed externally.
    restart: "no"
    # Health check confirms the container process is available.
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: windirstat-mcp-net
