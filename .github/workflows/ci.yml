name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t windirstat-mcp .

      - name: Test Docker image
        run: |
          set -o pipefail
          # The server reads from stdin and exits cleanly once it hits EOF
          # (docker run without -i closes stdin immediately), so this
          # naturally terminates. Bound it with `timeout` as a safety net
          # against any future change that makes it hang, and fail the job
          # if the process exits non-zero or never logs its startup message.
          output=$(timeout 15s docker run --rm windirstat-mcp 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "Docker smoke test failed: container exited with status $status"
            exit 1
          fi
          if ! echo "$output" | grep -q "WinDirStat MCP Server running on stdio"; then
            echo "Docker smoke test failed: expected startup message not found in output"
            exit 1
          fi